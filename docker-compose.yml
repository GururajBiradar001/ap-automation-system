services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: ap_automation, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ap_automation
      DEBUG: "True"
    depends_on: [db]
    ports: ["8000:8000"]
    volumes: ["./backend/media:/app/media"]
volumes: { pgdata: {} }
